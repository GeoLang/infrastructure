<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoLang demo</title>
  <link rel="stylesheet" href="landing.css">
  <script src="landing.js" defer></script>
</head>
<body>
  <main>
    <h1>GeoLang demo</h1>

    <p>GeoLang is an open-source map viewer with a chat agent that runs geospatial analysis for you. Ask a question about a place and it answers with layers on a shared map.</p>

    <label for="prompt">Try this prompt</label>
    <textarea id="prompt" rows="3" readonly>Every vacant commercial parcel within ten minutes of a Toronto subway station, ranked</textarea>

    <button id="start" type="button">Start the demo</button>
    <p id="status" role="status"></p>
    <p><a id="viewer-link" href="/" hidden>Open the viewer</a></p>

    <p id="hours"></p>

    <figure class="sample-report">
      <div class="sample-report-placeholder">Sample report</div>
      <figcaption>A sample site report will go here.</figcaption>
    </figure>
  </main>
</body>
</html>
